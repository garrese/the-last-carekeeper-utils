[package]
name = "the-last-carekeeper-utils"
version = "0.1.1"
description = "Local companion utility for The Last Caretaker"
authors = ["The Last Carekeeper Utils contributors"]
edition = "2024"

[lib]
name = "the_last_carekeeper_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1.3"
flate2 = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
