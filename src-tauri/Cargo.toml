[package]
name = "the-last-carekeeper-utils"
version = "0.1.4"
description = "Local companion utility for The Last Caretaker"
authors = ["The Last Carekeeper Utils contributors"]
edition = "2024"

[lib]
name = "the_last_carekeeper_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
csv = "1.3"
flate2 = "1.0"
png = "0.17"
retoc = { git = "https://github.com/trumank/retoc.git", rev = "885a8dae740cb1ce1e41ff2e74f67f9f0c118237" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[patch."https://github.com/trumank/repak.git"]
oodle_loader = { path = "vendor/oodle-loader-pure" }

[patch."https://github.com/trumank/jmap.git"]
jmap = { path = "vendor/jmap" }

[patch."https://github.com/trumank/ser-hex.git"]
ser-hex = { path = "vendor/ser-hex" }
